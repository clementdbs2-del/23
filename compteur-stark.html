<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1428">
<title>Compteur Stark — VESC Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#0a1424;
  --label:#d5dfef;
  --value:#eef4ff;
  --teal:#43d6e4;
  --yellow:#ffd44a;
  --pink:#ff5fae;
  --bartrack:rgba(96,130,196,.22);
  --font:"Bahnschrift","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;
}
html,body{height:100%;background:#04070d;overflow:hidden}
body{font-family:var(--font);color:var(--value);-webkit-user-select:none;user-select:none}

/* ---------- l'écran ---------- */
.screen{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 62% 55% at 46% 42%,#1a2b55 0%,transparent 60%),
    radial-gradient(ellipse 45% 40% at 46% 45%,#232a66 0%,transparent 55%),
    radial-gradient(ellipse 80% 70% at 50% 50%,#0d1a33 0%,#070f1f 78%,#050a14 100%);
  display:grid;
  grid-template:"top top top" minmax(48px,12vmin) "left mid right" 1fr / minmax(120px,20%) 1fr minmax(120px,20%);
  padding:2.6vmin 3.4vmin 4.6vmin;
}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 120% 110% at 50% 50%,transparent 55%,rgba(2,5,12,.55) 100%)}

/* ---------- rangée du haut ---------- */
.top{grid-area:top;display:flex;align-items:center;position:relative;z-index:2}
.shark{width:clamp(26px,5.4vmin,44px);opacity:.92;filter:drop-shadow(0 0 6px rgba(180,200,255,.35))}
.battwrap{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center}
.batt{width:clamp(80px,14.5vmin,126px);height:clamp(15px,3.2vmin,24px);border:2px solid var(--teal);border-radius:7px;
  position:relative;background:rgba(67,214,228,.10);box-shadow:0 0 10px rgba(67,214,228,.28),inset 0 0 6px rgba(67,214,228,.18)}
.batt i{position:absolute;inset:2px;border-radius:4px;background:linear-gradient(180deg,#5fe3ef,#2ab6c6);box-shadow:0 0 8px rgba(67,214,228,.55);transform-origin:left center}
.batt::after{content:"";position:absolute;right:-7px;top:25%;width:5px;height:50%;background:var(--teal);border-radius:0 3px 3px 0;opacity:.85}

/* ---------- colonnes ---------- */
.col{display:flex;flex-direction:column;justify-content:space-evenly;position:relative;z-index:2;min-height:0}
.col.left{grid-area:left;align-items:flex-start}
.col.right{grid-area:right;align-items:flex-end;text-align:right}
.blk{display:flex;flex-direction:column;gap:.7vmin}
.col.right .blk{align-items:flex-end}
.lab{font-size:clamp(10px,1.85vmin,17px);font-weight:700;letter-spacing:.34em;color:var(--label);opacity:.95}
.val{font-size:clamp(22px,4.6vmin,46px);font-weight:600;line-height:1;color:var(--value);
  text-shadow:0 0 12px rgba(150,180,255,.25);white-space:nowrap}
.val u{text-decoration:none;font-size:.52em;font-weight:500;margin-left:.18em;color:inherit;opacity:.9}
.val.teal{color:var(--teal);text-shadow:0 0 14px rgba(67,214,228,.4)}
.val.yellow{color:var(--yellow);text-shadow:0 0 14px rgba(255,212,74,.35)}
.val.pink{color:var(--pink);text-shadow:0 0 14px rgba(255,95,174,.35)}
.bar{width:clamp(70px,9.5vw,120px);height:clamp(3px,.75vmin,5px);border-radius:99px;background:var(--bartrack);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#b9ccf2;box-shadow:0 0 6px rgba(185,204,242,.5);
  transform-origin:left center;transition:transform .28s ease-out}
.col.right .bar{transform:scaleX(-1)}
.bar.yellow i{background:var(--yellow);box-shadow:0 0 6px rgba(255,212,74,.55)}
.bar.pink i{background:var(--pink);box-shadow:0 0 6px rgba(255,95,174,.5)}
.bar.dim i{opacity:.45}

/* ---------- cadran central ---------- */
.mid{grid-area:mid;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;z-index:2}
.gaugebox{position:relative;width:min(66vh,44vw);aspect-ratio:1;max-width:100%}
.gaugebox::before{content:"";position:absolute;inset:6%;border-radius:50%;
  background:radial-gradient(circle at 48% 42%,rgba(96,116,226,.26),rgba(70,84,190,.10) 55%,transparent 75%);pointer-events:none}
#gsvg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 7px rgba(110,92,255,.5))}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vmin}
.speed{font-size:clamp(76px,26vmin,200px);font-weight:600;line-height:.9;letter-spacing:-.01em;
  background:linear-gradient(180deg,#f4f8ff 20%,#aebfff 85%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 16px rgba(130,150,255,.32))}
.kmh{font-size:clamp(13px,2.6vmin,24px);font-weight:600;letter-spacing:.5em;margin-left:.5em;color:#cfdcf5;opacity:.95}
.mode{margin-top:clamp(10px,2.6vmin,26px);display:inline-flex;align-items:center;gap:1em;
  border:2px solid rgba(165,188,235,.75);border-radius:clamp(10px,1.8vmin,16px);
  padding:.5em 1.5em .5em 1.3em;font-size:clamp(13px,2.5vmin,23px);font-weight:700;letter-spacing:.3em;
  color:#f0f5ff;background:rgba(120,145,220,.07);
  box-shadow:0 0 12px rgba(140,165,240,.28),inset 0 0 10px rgba(140,165,240,.12)}
.mode svg{width:1.35em;height:1.1em}
.mode svg *{fill:#dbe6ff}

/* ---------- points de pagination ---------- */
.dots{position:absolute;left:50%;bottom:2.2vmin;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:2}
.dots i{height:4px;border-radius:99px;background:#7fa2c8;opacity:.85;display:block}
.dots i:nth-child(1){width:5px}.dots i:nth-child(2){width:16px;background:#a9c6e8}.dots i:nth-child(3){width:5px}

@media (orientation:portrait){
  .screen{grid-template:"top" minmax(40px,9vmin) "mid" 1fr "left" auto "right" auto / 1fr;padding:2vmin 4vmin 5vmin}
  .col{flex-direction:row;justify-content:space-between;padding:1.4vmin 0}
  .col.left{grid-area:left}.col.right{grid-area:right}
  .gaugebox{width:min(52vh,86vw)}
}
</style>
</head>
<body>
<div class="screen">

  <div class="top">
    <svg class="shark" viewBox="0 0 64 40" fill="none" stroke="#e8eefc" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M2 26 C8 12, 22 6, 34 9 L48 3 44 12 C56 12, 62 17, 61 21 C56 30, 40 33, 28 30 L14 37 17 29 C10 29, 5 28, 2 26 Z"/>
      <path d="M30 15 L37 13" opacity=".8"/>
    </svg>
    <div class="battwrap"><div class="batt"><i id="battFill" style="transform:scaleX(.77)"></i></div></div>
  </div>

  <div class="col left">
    <div class="blk">
      <span class="lab">MOTOR</span>
      <span class="val" id="motorT">-- <u>°C</u></span>
      <span class="bar dim"><i id="motorBar" style="transform:scaleX(.3)"></i></span>
    </div>
    <div class="blk">
      <span class="lab">CTRL</span>
      <span class="val" id="ctrlT">21 <u>°C</u></span>
      <span class="bar"><i id="ctrlBar" style="transform:scaleX(.38)"></i></span>
    </div>
    <div class="blk">
      <span class="lab">AMPS</span>
      <span class="val" id="amps">0 <u>A</u></span>
      <span class="bar"><i id="ampsBar" style="transform:scaleX(.05)"></i></span>
    </div>
  </div>

  <div class="mid">
    <div class="gaugebox">
      <svg viewBox="0 0 200 200" id="gsvg" aria-hidden="true">
        <defs>
          <linearGradient id="gb" x1="1" y1=".45" x2="0" y2=".55">
            <stop offset="0" stop-color="#2a3a68"/>
            <stop offset=".5" stop-color="#46509e"/>
            <stop offset="1" stop-color="#8f74ff"/>
          </linearGradient>
          <linearGradient id="gl" x1="1" y1=".45" x2="0" y2=".55">
            <stop offset="0" stop-color="#44509e"/>
            <stop offset=".5" stop-color="#9a7bff"/>
            <stop offset="1" stop-color="#efeaff"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="74" fill="none" stroke="#1e2f5e" stroke-width="2"
                stroke-dasharray="406.8 58.3" stroke-linecap="round" transform="rotate(180 100 100)" opacity=".85"/>
        <circle cx="100" cy="100" r="84" fill="none" stroke="url(#gb)" stroke-width="5.5"
                stroke-dasharray="461.8 66.1" stroke-linecap="round" transform="rotate(180 100 100)"/>
        <circle cx="100" cy="100" r="84" fill="none" stroke="url(#gl)" stroke-width="5.5"
                stroke-linecap="round" transform="rotate(180 100 100)" id="arc"/>
        <circle id="tip" cx="40.6" cy="159.4" r="4.6" fill="#eef0ff"/>
      </svg>
      <div class="center">
        <div class="speed" id="speed">46</div>
        <div class="kmh">KM/H</div>
        <div class="mode">
          <svg viewBox="0 0 26 20" aria-hidden="true">
            <circle cx="3" cy="17" r="2"/><circle cx="9" cy="17" r="2"/>
            <rect x="14" y="8" width="4" height="11" rx="1.4"/><rect x="21" y="2" width="4" height="17" rx="1.4"/>
          </svg>
          <span id="modeTxt">RACE</span>
        </div>
      </div>
    </div>
  </div>

  <div class="col right">
    <div class="blk">
      <span class="val teal" id="soc">77 <u>%</u></span>
    </div>
    <div class="blk">
      <span class="lab">VOLTS</span>
      <span class="val yellow" id="volts">56.4 <u>V</u></span>
      <span class="bar yellow"><i id="voltsBar" style="transform:scaleX(.55)"></i></span>
    </div>
    <div class="blk">
      <span class="lab">POWER</span>
      <span class="val pink" id="power">-0.0 <u>kW</u></span>
      <span class="bar pink dim"><i id="powerBar" style="transform:scaleX(.04)"></i></span>
    </div>
  </div>

  <div class="dots"><i></i><i></i><i></i></div>
</div>

<script>
"use strict";
/* géométrie de l'arc : cercle r=84, arc visible 315° commençant à 270° (9h00, boussole, sens horaire) */
const R=84,C=2*Math.PI*R,SWEEP=315,START=270;
const ARCLEN=C*SWEEP/360;
const TIP_A=START+SWEEP;         /* 225° = cap lumineux à 7h30, comme la photo */
const TIP=(()=>{const a=(TIP_A%360-90)*Math.PI/180;return[100+R*Math.cos(a),100+R*Math.sin(a)]})();
document.getElementById("tip").setAttribute("cx",TIP[0].toFixed(1));
document.getElementById("tip").setAttribute("cy",TIP[1].toFixed(1));
const arc=document.getElementById("arc");
arc.setAttribute("stroke-dasharray",`0 ${C.toFixed(1)}`);

function setArc(f){
  f=Math.max(0,Math.min(1,f));
  /* anneau toujours complet comme la photo : seule la brillance varie avec la vitesse */
  arc.setAttribute("stroke-dasharray",`${ARCLEN.toFixed(1)} ${C.toFixed(1)}`);
  arc.setAttribute("opacity",(.4+.6*f).toFixed(2));
}

/* ---------- simulation de balade (l'état initial reproduit la photo) ---------- */
const $=id=>document.getElementById(id);
const S={v:46,ctrl:21,motor:null,amps:0,volts:56.4,soc:77,power:-0.04,heat:0,phase:0,t0:performance.now()};
const MAXA=70,VMIN=50,VMAX=64;

function fmt(n,d){return n.toFixed(d)}
function render(){
  $("speed").textContent=Math.round(S.v);
  $("ctrlT").innerHTML=Math.round(S.ctrl)+" <u>°C</u>";
  $("motorT").innerHTML=(S.motor==null?"--":Math.round(S.motor))+" <u>°C</u>";
  $("amps").innerHTML=Math.round(Math.abs(S.amps))+" <u>A</u>";
  $("volts").innerHTML=fmt(S.volts,1)+" <u>V</u>";
  const p=S.power,sign=p<0?"-":"";
  $("power").innerHTML=sign+fmt(Math.abs(p),1)+" <u>kW</u>";
  $("soc").innerHTML=Math.round(S.soc)+" <u>%</u>";
  $("battFill").style.transform="scaleX("+(S.soc/100)+")";
  $("ctrlBar").style.transform="scaleX("+Math.min(1,S.ctrl/55)+")";
  $("motorBar").style.transform="scaleX("+(S.motor==null?.3:Math.min(1,S.motor/90))+")";
  $("ampsBar").style.transform="scaleX("+Math.min(1,Math.abs(S.amps)/MAXA)+")";
  $("voltsBar").style.transform="scaleX("+Math.min(1,Math.max(0,(S.volts-VMIN)/(VMAX-VMIN)))+")";
  $("powerBar").style.transform="scaleX("+Math.min(1,Math.abs(p)/6)+")";
  setArc(S.v/70);
}

/* cycles : repos (photo) → accélération → croisière → régén → arrêt */
const CYCLE=[
  {d:3.5, f:(k,S)=>{S.amps=0;S.v+= (0-S.v)*.04;}},
  {d:5.5, f:(k,S)=>{S.amps=MAXA*(.72+.25*Math.sin(k*6));S.v=Math.min(52,S.v+1.4-k*.6);}},
  {d:4.5, f:(k,S)=>{S.amps=34+8*Math.sin(k*4);S.v=Math.max(44,S.v-.06);}},
  {d:3,   f:(k,S)=>{S.amps=0;S.v=Math.max(0,S.v-7*(1-k));S.power=-.4;}},
  {d:2,   f:(k,S)=>{S.amps=0;S.v=Math.max(0,S.v-6*(1-k));}}
];
let last=performance.now();
function tick(now){
  const dt=(now-last)/1000;last=now;
  let ph=CYCLE[S.phase],t=(now-S.t0)/1000;
  if(t>=ph.d){S.phase=(S.phase+1)%CYCLE.length;S.t0=now;t=0;ph=CYCLE[S.phase];}
  const k=t/ph.d;
  ph.f(k,S);
  S.volts=56.4-S.amps*.021-(S.v>1?1.1:0)+Math.sin(now/900)*.06;
  S.power=S.amps>0? S.volts*S.amps/1000*(1+.04*Math.sin(now/700)) : (S.v>2? -.25-k*.2 : -0.04);
  S.heat+= (S.amps>10?1:-0.4)*dt;S.heat=Math.max(0,Math.min(30,S.heat));
  S.ctrl=21+S.heat*.45;
  S.motor=S.heat>4? 26+S.heat*.62 : null;
  if(S.power>0.05)S.soc=Math.max(2,S.soc-0.004*dt*(1+S.power));
  render();
  requestAnimationFrame(tick);
}
render();
requestAnimationFrame(t=>{last=t;tick(t)});
</script>
</body>
</html>
