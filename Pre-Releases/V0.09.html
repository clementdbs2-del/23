<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>VESC DASH</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #101010;
  --panel: #191919;
  --border: #303030;
  --orange: #ff6a00;
  --text: #fff;
  --muted: #999;
}

body {
  margin: 0;
  padding: 0 0 80px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

.status {
  color: var(--muted);
  font-size: 12px;
}

.top-power {
  width: 100%;
  height: 8px;
  background: #383838;
  overflow: hidden;
}

#powerFill {
  width: 0%;
  height: 100%;
  background: var(--orange);
  transition: width .12s linear;
}

main {
  padding: 14px;
  display: grid;
  grid-template-columns: 1fr 1.25fr 1fr;
  gap: 12px;
  max-width: 1400px;
  margin: 0 auto;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  min-width: 0;
}

.label {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.value {
  font-size: clamp(22px, 3vw, 34px);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.unit {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

.center-column { justify-content: center; }

.speed-card {
  text-align: center;
  padding: 28px 12px;
}

.speed {
  font-size: clamp(58px, 10vw, 110px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -4px;
}

.speed-unit {
  color: var(--muted);
  font-size: 15px;
  letter-spacing: 3px;
  margin-top: 10px;
}

.battery-card { text-align: center; }

.battery-value {
  font-size: 30px;
  font-weight: 800;
}

.battery-track {
  margin-top: 14px;
  width: 100%;
  height: 9px;
  border-radius: 10px;
  background: #383838;
  overflow: hidden;
}

#batteryFill {
  height: 100%;
  width: 0%;
  background: var(--orange);
  transition: width .3s;
}

.controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 14px;
  background: rgba(16,16,16,.96);
  border-top: 1px solid var(--border);
}

.controls button {
  border: 0;
  border-radius: 8px;
  padding: 13px 24px;
  background: var(--orange);
  color: white;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
}

.controls button:disabled { opacity: .5; }

#fullscreen {
  background: #303030;
  border: 1px solid #484848;
}

html:fullscreen .controls,
html:-webkit-full-screen .controls {
  display: none !important;
}

@media (max-width: 700px) {
  header { padding: 14px; }

  main {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
  }

  .center-column {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .left-column { grid-column: 1; }
  .right-column { grid-column: 2; }

  .card { padding: 12px; }
  .value { font-size: 23px; }
  .speed { font-size: 76px; }
  .speed-card { padding: 22px 10px; }

  .controls button { padding: 12px 18px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">VESC DASH</div>
  <div class="status" id="status">DÉCONNECTÉ</div>
</header>

<div class="top-power">
  <div id="powerFill"></div>
</div>

<main>
  <section class="column left-column">
    <div class="card">
      <div class="label">Tension batterie</div>
      <div class="value"><span id="voltage">--</span> <span class="unit">V</span></div>
    </div>

    <div class="card">
      <div class="label">Courant batterie</div>
      <div class="value"><span id="batteryCurrent">--</span> <span class="unit">A</span></div>
    </div>

    <div class="card">
      <div class="label">Temp. contrôleur</div>
      <div class="value"><span id="controllerTemp">--</span> <span class="unit">°C</span></div>
    </div>

    <div class="card">
      <div class="label">Régime moteur</div>
      <div class="value"><span id="rpm">--</span> <span class="unit">ERPM</span></div>
    </div>
  </section>

  <section class="column center-column">
    <div class="card speed-card">
      <div class="speed" id="speed">0</div>
      <div class="speed-unit">KM/H</div>
    </div>

    <div class="card battery-card">
      <div class="label">Batterie estimée</div>
      <div class="battery-value"><span id="batteryPercent">--</span><span class="unit"> %</span></div>
      <div class="battery-track">
        <div id="batteryFill"></div>
      </div>
      <div style="margin-top:12px;color:#999;font-size:12px">
        Estimation basée sur la tension
      </div>
    </div>
  </section>

  <section class="column right-column">
    <div class="card">
      <div class="label">Puissance électrique</div>
      <div class="value"><span id="power">--</span> <span class="unit">kW</span></div>
    </div>

    <div class="card">
      <div class="label">Courant moteur</div>
      <div class="value"><span id="motorCurrent">--</span> <span class="unit">A</span></div>
    </div>

    <div class="card">
      <div class="label">Duty cycle</div>
      <div class="value"><span id="duty">--</span> <span class="unit">%</span></div>
    </div>

    <div class="card">
      <div class="label">Connexion BLE</div>
      <div class="value" id="bleState" style="font-size:20px">OFFLINE</div>
    </div>
  </section>
</main>

<div class="controls" id="controls">
  <button id="connect">CONNECTER</button>
  <button id="fullscreen">PLEIN ÉCRAN</button>
</div>

<script>
const $ = id => document.getElementById(id);

const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txCharacteristic = null;
let rxCharacteristic = null;
let pollTimer = null;
let receiveBuffer = [];

function setStatus(message, connected = false) {
  $("status").textContent = message;
  $("bleState").textContent = connected ? "ONLINE" : "OFFLINE";
  $("bleState").style.color = connected ? "#64dc85" : "#ff6a00";
}

function crc16(data) {
  let crc = 0;

  for (const byte of data) {
    crc ^= byte << 8;

    for (let i = 0; i < 8; i++) {
      crc = (crc & 0x8000)
        ? ((crc << 1) ^ 0x1021)
        : (crc << 1);

      crc &= 0xffff;
    }
  }

  return crc;
}

function makePacket(command) {
  const payload = new Uint8Array([command]);
  const crc = crc16(payload);

  return new Uint8Array([
    2,
    payload.length,
    ...payload,
    (crc >> 8) & 0xff,
    crc & 0xff,
    3
  ]);
}

async function sendCommand(command) {
  if (!txCharacteristic) return;

  const packet = makePacket(command);

  if (txCharacteristic.writeValueWithoutResponse) {
    await txCharacteristic.writeValueWithoutResponse(packet);
  } else {
    await txCharacteristic.writeValue(packet);
  }
}

function readInt16(data, offset) {
  return (data[offset] << 8) | data[offset + 1];
}

function readInt32(data, offset) {
  return (
    data[offset] * 0x1000000 +
    (data[offset + 1] << 16) +
    (data[offset + 2] << 8) +
    data[offset + 3]
  );
}

function readSigned16(data, offset) {
  const value = readInt16(data, offset);
  return value > 32767 ? value - 65536 : value;
}

function readSigned32(data, offset) {
  const value = readInt32(data, offset);
  return value > 2147483647 ? value - 4294967296 : value;
}

/*
 * Le payload commence par le code COMM_GET_VALUES (0x04).
 * Les champs suivants sont indexés à partir de ce payload.
 */
function parseVescPayload(data) {
  if (data.length < 29 || data[0] !== 4) return;

  const tempFet = readSigned16(data, 1) / 10;
  const motorCurrent = readSigned32(data, 5) / 100;
  const batteryCurrent = readSigned32(data, 9) / 100;
  const duty = readSigned16(data, 21) / 10;
  const rpm = readSigned32(data, 23);
  const voltage = readSigned16(data, 27) / 10;

  $("controllerTemp").textContent = tempFet.toFixed(1);
  $("motorCurrent").textContent = motorCurrent.toFixed(1);
  $("batteryCurrent").textContent = batteryCurrent.toFixed(1);
  $("rpm").textContent = Math.round(rpm).toLocaleString("fr-FR");
  $("voltage").textContent = voltage.toFixed(1);
  $("duty").textContent = duty.toFixed(1);

  const powerKw = voltage * batteryCurrent / 1000;
  $("power").textContent = powerKw.toFixed(2);

  // Estimation approximative pour une batterie Li-ion 14s.
  const percent = Math.max(0, Math.min(100, (voltage - 39) / (58.8 - 39) * 100));
  $("batteryPercent").textContent = Math.round(percent);
  $("batteryFill").style.width = percent + "%";

  // Courant moteur utilisé comme indicateur visuel, pas comme poignée.
  $("powerFill").style.width =
    Math.min(100, Math.abs(motorCurrent)) + "%";
}

/*
 * Les notifications BLE peuvent arriver en plusieurs morceaux.
 * On reconstitue les trames avant de vérifier le CRC et de lire les valeurs.
 */
function processReceiveBuffer() {
  while (receiveBuffer.length >= 2) {
    const startIndex = receiveBuffer.findIndex(
      byte => byte === 2 || byte === 3
    );

    if (startIndex < 0) {
      receiveBuffer = [];
      return;
    }

    if (startIndex > 0) {
      receiveBuffer.splice(0, startIndex);
    }

    if (receiveBuffer[0] === 2) {
      if (receiveBuffer.length < 2) return;

      const payloadLength = receiveBuffer[1];
      const frameLength = payloadLength + 5;

      if (receiveBuffer.length < frameLength) return;

      const frame = receiveBuffer.slice(0, frameLength);

      if (frame[frameLength - 1] !== 3) {
        receiveBuffer.shift();
        continue;
      }

      const payload = frame.slice(2, 2 + payloadLength);
      const receivedCrc =
        (frame[2 + payloadLength] << 8) |
        frame[3 + payloadLength];

      if (crc16(payload) === receivedCrc) {
        parseVescPayload(payload);
      }

      receiveBuffer.splice(0, frameLength);
    } else {
      // Trame longue VESC : en-tête 03 + longueur sur 2 octets.
      if (receiveBuffer.length < 3) return;

      const payloadLength =
        (receiveBuffer[1] << 8) | receiveBuffer[2];

      const frameLength = payloadLength + 6;

      if (receiveBuffer.length < frameLength) return;

      const frame = receiveBuffer.slice(0, frameLength);
      const payload = frame.slice(3, 3 + payloadLength);
      const receivedCrc =
        (frame[3 + payloadLength] << 8) |
        frame[4 + payloadLength];

      if (
        frame[frameLength - 1] === 3 &&
        crc16(payload) === receivedCrc
      ) {
        parseVescPayload(payload);
      }

      receiveBuffer.splice(0, frameLength);
    }
  }
}

function handleNotification(event) {
  const view = event.target.value;

  // Respecte l'offset réel du DataView BLE.
  const bytes = new Uint8Array(
    view.buffer,
    view.byteOffset,
    view.byteLength
  );

  receiveBuffer.push(...bytes);

  // Protection contre un tampon anormalement grand.
  if (receiveBuffer.length > 4096) {
    receiveBuffer = receiveBuffer.slice(-1024);
  }

  processReceiveBuffer();
}

async function connectVesc() {
  if (!navigator.bluetooth) {
    alert("Bluetooth BLE non disponible. Essaie Chrome ou Edge sur un appareil compatible.");
    return;
  }

  try {
    $("connect").disabled = true;
    setStatus("RECHERCHE...");

    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });

    device.addEventListener("gattserverdisconnected", onDisconnected);

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    // RX côté VESC = caractéristique sur laquelle on écrit.
    txCharacteristic = await service.getCharacteristic(RX_UUID);

    // TX côté VESC = caractéristique qui envoie les notifications.
    rxCharacteristic = await service.getCharacteristic(TX_UUID);

    await rxCharacteristic.startNotifications();
    rxCharacteristic.addEventListener(
      "characteristicvaluechanged",
      handleNotification
    );

    receiveBuffer = [];

    setStatus("CONNECTÉ", true);
    $("connect").textContent = "DÉCONNECTER";
    $("connect").disabled = false;

    await sendCommand(4);

    clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      sendCommand(4).catch(error => console.error("Envoi VESC :", error));
    }, 500);

  } catch (error) {
    console.error("Connexion VESC :", error);
    setStatus("ERREUR BLE");
    $("connect").textContent = "CONNECTER";
    $("connect").disabled = false;
  }
}

function onDisconnected() {
  clearInterval(pollTimer);
  pollTimer = null;
  txCharacteristic = null;
  rxCharacteristic = null;
  receiveBuffer = [];

  setStatus("DÉCONNECTÉ");
  $("connect").textContent = "CONNECTER";
  $("connect").disabled = false;
}

function disconnectVesc() {
  clearInterval(pollTimer);
  pollTimer = null;

  if (device?.gatt?.connected) {
    device.gatt.disconnect();
  } else {
    onDisconnected();
  }
}

$("connect").addEventListener("click", () => {
  if (device?.gatt?.connected) {
    disconnectVesc();
  } else {
    connectVesc();
  }
});

$("fullscreen").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error("Plein écran :", error);
  }
});

function updateFullscreenControls() {
  const fullscreen = Boolean(
    document.fullscreenElement ||
    document.webkitFullscreenElement
  );

  $("controls").style.display = fullscreen ? "none" : "flex";
}

document.addEventListener("fullscreenchange", updateFullscreenControls);
document.addEventListener("webkitfullscreenchange", updateFullscreenControls);
</script>
</body>
</html>
