<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>VESC DASH</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #101010;
  --panel: #191919;
  --border: #303030;
  --orange: #ff6a00;
  --text: #ffffff;
  --muted: #999999;
}

body {
  margin: 0;
  padding: 0 0 85px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

.status {
  color: var(--muted);
  font-size: 12px;
}

.top-power {
  width: 100%;
  height: 8px;
  background: #383838;
  overflow: hidden;
}

#powerFill {
  width: 0%;
  height: 100%;
  background: var(--orange);
  transition: width 0.12s linear;
}

main {
  padding: 14px;
  display: grid;
  grid-template-columns: 1fr 1.25fr 1fr;
  gap: 12px;
  max-width: 1400px;
  margin: 0 auto;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  min-width: 0;
}

.label {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.value {
  font-size: clamp(22px, 3vw, 34px);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.unit {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

.center-column {
  justify-content: center;
}

.speed-card {
  text-align: center;
  padding: 28px 12px;
}

.speed {
  font-size: clamp(58px, 10vw, 110px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -4px;
}

.speed-unit {
  color: var(--muted);
  font-size: 15px;
  letter-spacing: 3px;
  margin-top: 10px;
}

.battery-card {
  text-align: center;
}

.battery-value {
  font-size: 30px;
  font-weight: 800;
}

.battery-track {
  margin-top: 14px;
  width: 100%;
  height: 9px;
  border-radius: 10px;
  background: #383838;
  overflow: hidden;
}

#batteryFill {
  height: 100%;
  width: 0%;
  background: var(--orange);
  transition: width 0.3s;
}

.controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 14px;
  background: rgba(16, 16, 16, 0.96);
  border-top: 1px solid var(--border);
}

.controls button {
  border: 0;
  border-radius: 8px;
  padding: 13px 24px;
  background: var(--orange);
  color: white;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
}

.controls button:disabled {
  opacity: 0.5;
}

#fullscreen {
  background: #303030;
  border: 1px solid #484848;
}

/* Masquer les deux boutons en plein écran */
html:fullscreen .controls,
html:-webkit-full-screen .controls {
  display: none !important;
}

@media (max-width: 700px) {
  header {
    padding: 14px;
  }

  main {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
  }

  .center-column {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .left-column {
    grid-column: 1;
  }

  .right-column {
    grid-column: 2;
  }

  .card {
    padding: 12px;
  }

  .value {
    font-size: 23px;
  }

  .speed {
    font-size: 76px;
  }

  .speed-card {
    padding: 22px 10px;
  }

  .controls button {
    padding: 12px 18px;
  }
}
</style>
</head>

<body>
<header>
  <div class="logo">VESC DASH</div>
  <div class="status" id="status">DÉCONNECTÉ</div>
</header>

<!-- Barre orange située entre le titre et les informations -->
<div class="top-power">
  <div id="powerFill"></div>
</div>

<main>
  <section class="column left-column">
    <div class="card">
      <div class="label">Tension batterie</div>
      <div class="value"><span id="voltage">--</span> <span class="unit">V</span></div>
    </div>

    <div class="card">
      <div class="label">Courant batterie</div>
      <div class="value"><span id="batteryCurrent">--</span> <span class="unit">A</span></div>
    </div>

    <div class="card">
      <div class="label">Temp. contrôleur</div>
      <div class="value"><span id="controllerTemp">--</span> <span class="unit">°C</span></div>
    </div>

    <div class="card">
      <div class="label">Régime moteur</div>
      <div class="value"><span id="rpm">--</span> <span class="unit">RPM</span></div>
    </div>
  </section>

  <section class="column center-column">
    <div class="card speed-card">
      <div class="speed" id="speed">0</div>
      <div class="speed-unit">KM/H</div>
    </div>

    <div class="card battery-card">
      <div class="label">Batterie estimée</div>
      <div class="battery-value"><span id="batteryPercent">--</span><span class="unit"> %</span></div>
      <div class="battery-track">
        <div id="batteryFill"></div>
      </div>
      <div style="margin-top:12px;color:#999;font-size:12px">
        Estimation basée sur la tension
      </div>
    </div>
  </section>

  <section class="column right-column">
    <div class="card">
      <div class="label">Puissance</div>
      <div class="value"><span id="power">--</span> <span class="unit">kW</span></div>
    </div>

    <div class="card">
      <div class="label">Courant moteur</div>
      <div class="value"><span id="motorCurrent">--</span> <span class="unit">A</span></div>
    </div>

    <div class="card">
      <div class="label">Duty cycle</div>
      <div class="value"><span id="duty">--</span> <span class="unit">%</span></div>
    </div>

    <div class="card">
      <div class="label">Connexion BLE</div>
      <div class="value" id="bleState" style="font-size:20px">OFFLINE</div>
    </div>
  </section>
</main>

<div class="controls" id="controls">
  <button id="connect">CONNECTER</button>
  <button id="fullscreen">PLEIN ÉCRAN</button>
</div>

<script>
const $ = id => document.getElementById(id);

const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txCharacteristic = null;
let rxCharacteristic = null;
let pollTimer = null;

function setStatus(message, connected = false) {
  $("status").textContent = message;
  $("bleState").textContent = connected ? "ONLINE" : "OFFLINE";
  $("bleState").style.color = connected ? "#64dc85" : "#ff6a00";
}

function crc16(buffer) {
  let crc = 0;
  for (const byte of buffer) {
    crc ^= byte << 8;
    for (let i = 0; i < 8; i++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xffff;
    }
  }
  return crc;
}

function makePacket(command) {
  const payload = new Uint8Array([command]);
  const crc = crc16(payload);
  return new Uint8Array([
    2,
    payload.length,
    ...payload,
    (crc >> 8) & 0xff,
    crc & 0xff,
    3
  ]);
}

async function sendCommand(command) {
  if (!txCharacteristic) return;
  const packet = makePacket(command);

  if (txCharacteristic.writeValueWithoutResponse) {
    await txCharacteristic.writeValueWithoutResponse(packet);
  } else {
    await txCharacteristic.writeValue(packet);
  }
}

function signed16(data, offset) {
  return (data[offset] << 8) | data[offset + 1];
}

function signed32(data, offset) {
  return (
    (data[offset] << 24) |
    (data[offset + 1] << 16) |
    (data[offset + 2] << 8) |
    data[offset + 3]
  );
}

function parseVescPayload(data) {
  /*
    Format classique COMM_GET_VALUES.
    Les champs suivants correspondent au protocole VESC standard.
  */
  if (data.length < 26 || data[0] !== 4) return;

  const tempMos = signed16(data, 1) / 10;
  const motorCurrent = signed32(data, 5) / 100;
  const batteryCurrent = signed32(data, 9) / 100;
  const rpm = signed32(data, 23);
  const voltage = signed16(data, 27) / 10;

  $("controllerTemp").textContent = Number.isFinite(tempMos) ? tempMos.toFixed(1) : "--";
  $("motorCurrent").textContent = Number.isFinite(motorCurrent) ? motorCurrent.toFixed(1) : "--";
  $("batteryCurrent").textContent = Number.isFinite(batteryCurrent) ? batteryCurrent.toFixed(1) : "--";
  $("rpm").textContent = Number.isFinite(rpm) ? Math.round(rpm).toLocaleString("fr-FR") : "--";
  $("voltage").textContent = Number.isFinite(voltage) ? voltage.toFixed(1) : "--";

  const powerKw = voltage * batteryCurrent / 1000;
  $("power").textContent = Number.isFinite(powerKw) ? powerKw.toFixed(2) : "--";

  const percent = Math.max(0, Math.min(100, ((voltage - 39) / (58 - 39)) * 100));
  $("batteryPercent").textContent = Math.round(percent);
  $("batteryFill").style.width = percent + "%";

  const duty = signed16(data, 21) / 10;
  $("duty").textContent = Number.isFinite(duty) ? duty.toFixed(1) : "--";

  // Cette barre indique le courant moteur, pas la position réelle de la poignée.
  $("powerFill").style.width = Math.min(100, Math.abs(motorCurrent)) + "%";
}

function handleNotification(event) {
  const packet = new Uint8Array(event.target.value.buffer);
  if (packet.length < 6 || packet[0] !== 2) return;

  const payloadLength = packet[1];
  if (packet.length < payloadLength + 5) return;

  const payload = packet.slice(2, 2 + payloadLength);
  const receivedCrc = (packet[2 + payloadLength] << 8) | packet[3 + payloadLength];

  if (crc16(payload) !== receivedCrc) return;
  parseVescPayload(payload);
}

async function connectVesc() {
  if (!navigator.bluetooth) {
    alert("Le Bluetooth BLE n'est pas disponible. Essaie Chrome ou Edge sur un appareil compatible.");
    return;
  }

  try {
    $("connect").disabled = true;
    setStatus("RECHERCHE...");

    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });

    device.addEventListener("gattserverdisconnected", disconnectVesc);

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    txCharacteristic = await service.getCharacteristic(RX_UUID);
    rxCharacteristic = await service.getCharacteristic(TX_UUID);

    await rxCharacteristic.startNotifications();
    rxCharacteristic.addEventListener("characteristicvaluechanged", handleNotification);

    setStatus("CONNECTÉ", true);
    $("connect").textContent = "DÉCONNECTER";

    await sendCommand(4);
    clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      sendCommand(4).catch(console.error);
    }, 500);
  } catch (error) {
    console.error(error);
    setStatus("DÉCONNECTÉ");
    $("connect").textContent = "CONNECTER";
    $("connect").disabled = false;
  }
}

function disconnectVesc() {
  clearInterval(pollTimer);
  pollTimer = null;
  txCharacteristic = null;
  rxCharacteristic = null;

  if (device?.gatt?.connected) {
    device.gatt.disconnect();
  }

  setStatus("DÉCONNECTÉ");
  $("connect").textContent = "CONNECTER";
  $("connect").disabled = false;
}

$("connect").addEventListener("click", () => {
  if (device?.gatt?.connected) {
    disconnectVesc();
  } else {
    connectVesc();
  }
});

$("fullscreen").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error("Plein écran indisponible :", error);
    alert("Le plein écran n'est pas pris en charge dans ce navigateur.");
  }
});

/* Garde les boutons masqués en plein écran et les réaffiche à la sortie. */
function updateFullscreenControls() {
  const controls = $("controls");
  const fullscreen = Boolean(
    document.fullscreenElement || document.webkitFullscreenElement
  );

  controls.style.display = fullscreen ? "none" : "flex";
}

document.addEventListener("fullscreenchange", updateFullscreenControls);
document.addEventListener("webkitfullscreenchange", updateFullscreenControls);
</script>
</body>
</html>
