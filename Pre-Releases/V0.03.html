
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0c0b">
<title>VARG Dashboard</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c0b;
  --panel:#171917;
  --muted:#858b83;
  --green:#c4ff4d;
  --orange:#ff9d36;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:white;
  font-family:Arial,Helvetica,sans-serif;
  height:100dvh;overflow:hidden
}
main{
  height:100%;width:100%;max-width:1100px;margin:auto;
  padding:12px 22px;
  display:flex;flex-direction:column
}
header{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #2b2e2a;padding-bottom:10px
}
.brand{font-size:12px;font-weight:bold;letter-spacing:4px;color:var(--green)}
#status{font-size:10px;color:var(--muted)}
#status.ok{color:var(--green)}
.content{
  flex:1;min-height:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:12px
}
.speed-block{text-align:center}
.speed-label,.label{
  color:var(--muted);font-size:10px;letter-spacing:3px
}
.speed{
  font-size:clamp(100px,25vh,190px);
  line-height:.95;font-weight:800;letter-spacing:-8px;
  font-variant-numeric:tabular-nums
}
.speed-unit{font-size:15px;color:var(--muted);letter-spacing:3px}
.battery{
  width:min(440px,90%);background:var(--panel);
  border:1px solid #292c28;border-radius:16px;padding:14px 20px
}
.battery-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.percent{
  color:var(--green);font-size:clamp(40px,9vh,65px);
  font-weight:800;letter-spacing:-3px
}
.voltage{font-size:13px;color:var(--muted)}
.bar{
  width:100%;height:10px;background:#353832;
  border-radius:20px;overflow:hidden;margin-top:10px
}
.fill{height:100%;width:0%;transition:width .2s}
#batteryFill{background:var(--green)}
#powerFill{background:var(--orange)}
.power{
  width:min(440px,90%);padding:0 2px
}
.power-top{display:flex;justify-content:space-between;align-items:center}
.power-value{font-size:14px;font-weight:bold}
.controls{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding-top:10px
}
button{
  border:0;border-radius:10px;padding:13px 8px;
  background:var(--green);color:#111;font-weight:bold;font-size:12px
}
button.secondary{background:#252825;color:white;border:1px solid #3b3e39}
footer{
  color:#565b54;text-align:center;font-size:9px;
  letter-spacing:2px;padding-top:8px
}
@media (orientation:portrait){
  .speed{font-size:clamp(90px,18vw,145px)}
  .content{gap:18px}
}
@media (max-height:450px) and (orientation:landscape){
  main{padding:6px 18px}
  header{padding-bottom:5px}
  .content{gap:6px}
  .speed{font-size:clamp(75px,24vh,115px);letter-spacing:-4px}
  .speed-unit{font-size:11px}
  .battery{padding:7px 14px;border-radius:10px}
  .percent{font-size:clamp(30px,8vh,42px)}
  .bar{height:7px;margin-top:5px}
  .controls{padding-top:5px;gap:7px}
  button{padding:9px}
  footer{padding-top:4px}
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">VARG / ELECTRIC</div>
  <div id="status">DÉCONNECTÉ</div>
</header>

<div class="content">
  <section class="speed-block">
    <div class="speed-label">VITESSE</div>
    <div class="speed">0</div>
    <div class="speed-unit">KM/H</div>
  </section>

  <section class="battery">
    <div class="battery-top">
      <div>
        <div class="label">BATTERIE</div>
        <div class="percent" id="percent">--%</div>
      </div>
      <div class="voltage" id="voltage">-- V</div>
    </div>
    <div class="bar"><div class="fill" id="batteryFill"></div></div>
  </section>

  <section class="power">
    <div class="power-top">
      <div class="label">PUISSANCE MOTEUR</div>
      <div class="power-value" id="powerValue">-- A</div>
    </div>
    <div class="bar"><div class="fill" id="powerFill"></div></div>
  </section>
</div>

<div class="controls">
  <button id="connect">CONNECTER LE VESC</button>
  <button class="secondary" id="fullscreen">PLEIN ÉCRAN</button>
</div>
<footer>VES C TELEMETRY · DASHBOARD</footer>
</main>

<script>
"use strict";

const SERVICE="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const $=id=>document.getElementById(id);

let device,writer,connected=false,timer=null;
let buffer=new Uint8Array(0),busy=false,lastData=0;

function status(s,ok=false){
  $("status").textContent=s;
  $("status").className=ok?"ok":"";
}
function i16(a,p){
  const n=(a[p]<<8)|a[p+1];
  return n&0x8000?n-0x10000:n;
}
function i32(a,p){
  return (a[p]<<24)|(a[p+1]<<16)|(a[p+2]<<8)|a[p+3];
}
function crc16(data){
  let crc=0;
  for(const b of data){
    crc^=b<<8;
    for(let i=0;i<8;i++)
      crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);
    crc&=65535;
  }
  return crc;
}
function packet(payload){
  const out=new Uint8Array(payload.length+5);
  out[0]=2;out[1]=payload.length;out.set(payload,2);
  const c=crc16(payload);
  out[out.length-3]=c>>8;
  out[out.length-2]=c&255;
  out[out.length-1]=3;
  return out;
}

function parseFrame(f){
  if(f.length<6||f[0]!==2)return;
  const len=f[1];
  if(f.length!==len+5)return;
  const p=f.slice(2,2+len);
  if(crc16(p)!==((f[2+len]<<8)|f[3+len]))return;
  if(f[4+len]!==3||p[0]!==4)return;

  const d=p.slice(1);
  if(d.length<28)return;

  const motorCurrent=i32(d,4)/100;
  const batteryCurrent=i32(d,8)/100;
  const voltage=i16(d,26)/10;

  if(![motorCurrent,batteryCurrent,voltage].every(Number.isFinite))return;

  // Estimation linéaire de tension, limitée à la plage 39–58 V.
  const pct=Math.max(0,Math.min(100,(voltage-39)/(58-39)*100));
  $("percent").textContent=Math.round(pct)+"%";
  $("voltage").textContent=voltage.toFixed(1)+" V";
  $("batteryFill").style.width=pct+"%";

  // Indicateur visuel de courant moteur, pas de commande d'accélération.
  // Échelle d'affichage provisoire : 0 à 100 A.
  const powerPct=Math.max(0,Math.min(100,Math.abs(motorCurrent)));
  $("powerFill").style.width=powerPct+"%";
  $("powerValue").textContent=motorCurrent.toFixed(1)+" A";

  lastData=Date.now();
  status("CONNECTÉ",true);
}

function receive(chunk){
  const m=new Uint8Array(buffer.length+chunk.length);
  m.set(buffer);m.set(chunk,buffer.length);buffer=m;
  while(buffer.length>=2){
    const start=buffer.indexOf(2);
    if(start<0){buffer=new Uint8Array(0);return;}
    if(start>0)buffer=buffer.slice(start);
    if(buffer.length<2)return;
    const len=buffer[1],total=len+5;
    if(len<1||len>255){buffer=buffer.slice(1);continue;}
    if(buffer.length<total)return;
    parseFrame(buffer.slice(0,total));
    buffer=buffer.slice(total);
  }
}

async function disconnect(){
  connected=false;clearInterval(timer);timer=null;writer=null;
  if(device?.gatt?.connected)device.gatt.disconnect();
  status("DÉCONNECTÉ");
  $("connect").textContent="CONNECTER LE VESC";
  $("connect").disabled=false;
}

async function connect(){
  if(!navigator.bluetooth){
    status("BLUETOOTH INDISPONIBLE");
    return;
  }
  $("connect").disabled=true;
  try{
    device=await navigator.bluetooth.requestDevice({
      filters:[{services:[SERVICE]}]
    });
    device.addEventListener("gattserverdisconnected",()=>{
      connected=false;clearInterval(timer);
      status("DÉCONNECTÉ");
      $("connect").textContent="RECONNECTER";
      $("connect").disabled=false;
    });

    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE);
    writer=await service.getCharacteristic(RX);
    const tx=await service.getCharacteristic(TX);
    await tx.startNotifications();
    tx.addEventListener("characteristicvaluechanged",e=>{
      const v=e.target.value;
      receive(new Uint8Array(v.buffer,v.byteOffset,v.byteLength));
    });

    connected=true;buffer=new Uint8Array(0);lastData=Date.now();
    status("CONNECTÉ",true);
    $("connect").textContent="DÉCONNECTER";
    $("connect").disabled=false;

    timer=setInterval(async()=>{
      if(!connected||busy||!writer)return;
      if(Date.now()-lastData>5000)status("PAS DE DONNÉES");
      busy=true;
      try{
        await writer.writeValueWithoutResponse(packet(new Uint8Array([4])));
      }catch(e){
        status("ERREUR LECTURE");
      }finally{busy=false;}
    },500);
  }catch(e){
    status("ÉCHEC CONNEXION");
    $("connect").disabled=false;
  }
}

$("connect").addEventListener("click",()=>connected?disconnect():connect());
$("fullscreen").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
});
screen.orientation?.lock?.("landscape").catch(()=>{});
</script>
</body>
</html>
